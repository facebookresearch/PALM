name: volume-ref-dir-radiance
# input_feature_dim: ${add:${model.geometry.feature_dim}, 3} # surface normal as additional input
# input_feature_dim: ${add:${model.geometry.feature_dim}, 67} # surface normal (3) + pose encoding
input_feature_dim: ${add:${model.geometry.feature_dim}, 67} # surface normal (3) + pose encoding (64) + subject code (64)
# input_feature_dim: ${add:${model.geometry.feature_dim}, 579} # surface normal (3) + pose encoding (64) + subject code (512)
# input_feature_dim: ${add:${model.geometry.feature_dim}, 1091} # surface normal (3) + pose encoding (64) + subject code (512) + time code (512)
xyz_encoding_config:
  otype: ProgressiveBandHashGrid
  n_levels: 32
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  per_level_scale: 1.447269237440378  # not used
    # per_level_scale: 1.5
  interpolation: Linear
  include_xyz: true
  # start from start_step and start_level, increase feature level by 1 very update_steps steps
  start_level: 4
  update_steps: 500
  start_step: 3000
  full_band_step: 18000  ## full_band_step for SphericalHarmonics to fully activate
dir_encoding_config:
  otype: SphericalHarmonics
  degree: 4    
mlp_network_config:
  otype: VanillaMLP
  activation: ReLU
  output_activation: none # activation function for MLP before returned
  n_neurons: 64 # MLP dim
  n_hidden_layers: 2 # MLP layers
color_activation: sigmoid
